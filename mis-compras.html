<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Compras - Origen Puro Coffee</title>
    <meta name="description" content="Revisa tu historial de compras y pedidos">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CSS Elegante -->
    <link rel="stylesheet" href="css/styles-elegant.css">
    <link rel="stylesheet" href="css/header-responsive.css">
</head>
<body>
    <!-- HEADER FIJO ELEGANTE CON MENU RESPONSIVE -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="Origen Puro Coffee" class="header-logo-image">
                </a>
            </div>
            
            <!-- Botón hamburger para móvil -->
            <button class="menu-toggle" onclick="toggleMenu()">
                ☰
            </button>
            
            <nav class="nav" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="mis-compras.html">Mis Compras</a>
                <a href="carrito.html" class="cart-link">
                    <i class="ph ph-shopping-cart"></i> Carrito (<span id="cart-count">0</span>)
                </a>
            </nav>
        </div>
    </header>

    <!-- MIS COMPRAS -->
    <section class="pedidos-section">
        <div class="container">
            <h1 class="page-title"><i class="ph ph-package"></i> Mis Compras</h1>

            <!-- Sin pedidos -->
            <div id="sin-pedidos" class="carrito-vacio" style="display: none;">
                <div class="empty-state">
                    <div class="empty-icon">🛍️</div>
                    <h2>No tienes compras aún</h2>
                    <p>Cuando realices tu primera compra, aparecerá aquí tu historial de pedidos</p>
                    <a href="index.html" class="btn btn-primary">Ir a la tienda</a>
                </div>
            </div>

            <!-- Lista de pedidos -->
            <div id="lista-pedidos" class="pedidos-lista">
                <!-- Loading placeholder -->
                <div class="loading-placeholder">
                    <p>Cargando historial de compras...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- El footer se genera dinámicamente con JavaScript -->

    <!-- Scripts - ORDEN CORRECTO -->
     <script src="js/header-responsive.js"></script>
    <script src="js/config.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/elegant-interactions.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // INICIALIZACIÓN PRINCIPAL CON DEBUG
        document.addEventListener('DOMContentLoaded', () => {
            console.log('📦 Iniciando página Mis Compras...');
            
            try {
                // 1. Inicializar elementos del sitio si existe la función
                if (typeof initializeSiteElements === 'function') {
                    console.log('🔧 Inicializando elementos del sitio...');
                    initializeSiteElements();
                } else {
                    console.warn('⚠️ initializeSiteElements no disponible');
                }
                
                // 2. Actualizar contador del carrito
                if (typeof carrito !== 'undefined' && carrito.actualizarContador) {
                    console.log('Actualizando contador del carrito...');
                    carrito.actualizarContador();
                } else {
                    console.warn('⚠️ carrito no disponible');
                }
                
                if (typeof updateCartCounter === 'function') {
                    updateCartCounter();
                }
                
                // 3. Mostrar pedidos
                console.log('📋 Cargando historial de pedidos...');
                if (typeof mostrarPedidos === 'function') {
                    mostrarPedidos();
                    console.log('✅ Pedidos cargados');
                } else {
                    console.error('❌ mostrarPedidos no está disponible');
                    document.getElementById('lista-pedidos').innerHTML = 
                        '<div style="text-align: center; padding: 2rem; color: #d32f2f;">Error: No se puede cargar el historial de compras</div>';
                }
                
                console.log('✅ Página Mis Compras cargada completamente');
                
            } catch (error) {
                console.error('❌ Error durante la inicialización de Mis Compras:', error);
                
                // Mostrar error
                const errorMsg = `
                    <div style="text-align: center; padding: 2rem; color: #d32f2f; background: #ffebee; border-radius: 8px; margin: 1rem 0;">
                        <strong>Error técnico</strong><br>
                        No se puede cargar el historial de compras en este momento.<br>
                        <small>Error: ${error.message}</small>
                    </div>
                `;
                
                const listaPedidos = document.getElementById('lista-pedidos');
                if (listaPedidos) listaPedidos.innerHTML = errorMsg;
            }
        });
    </script>
</body>
</html>
