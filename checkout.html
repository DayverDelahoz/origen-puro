<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Origen Puro Coffee</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <!-- Se actualizará dinámicamente con JavaScript -->
                </div>
                <nav class="nav">
                    <a href="index.html">Inicio</a>
                    <a href="mis-compras.html">Mis Compras</a>
                    <a href="carrito.html" class="cart-link">
                        🛒 Carrito (<span id="cart-count">0</span>)
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- CHECKOUT -->
    <section class="checkout-section">
        <div class="container">
            <h1 class="page-title">Finalizar compra</h1>

            <div class="checkout-layout">
                <!-- Formulario de datos -->
                <div class="checkout-form">
                    <h2>Datos de envío</h2>
                    
                    <form id="form-checkout">
                        <div class="form-group">
                            <label for="nombre">Nombre completo *</label>
                            <input type="text" id="nombre" name="nombre" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="telefono">Teléfono *</label>
                            <input type="tel" id="telefono" name="telefono" required>
                        </div>

                        <div class="form-group">
                            <label for="direccion">Dirección *</label>
                            <input type="text" id="direccion" name="direccion" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="ciudad">Ciudad *</label>
                                <input type="text" id="ciudad" name="ciudad" required>
                            </div>

                            <div class="form-group">
                                <label for="codigo-postal">C.P. *</label>
                                <input type="text" id="codigo-postal" name="codigo-postal" required>
                            </div>
                        </div>
                    </form>

                    <!-- Método de pago -->
                    <div class="metodo-pago">
                        <h2>Método de pago</h2>
                        
                        <div class="pago-opciones">
                            <label class="pago-opcion">
                                <input type="radio" name="metodo-pago" value="paypal" checked>
                                <span class="pago-label">
                                    <strong>PayPal</strong>
                                    <small>Pago seguro con PayPal</small>
                                </span>
                            </label>

                            <label class="pago-opcion">
                                <input type="radio" name="metodo-pago" value="redsys">
                                <span class="pago-label">
                                    <strong>Tarjeta de crédito</strong>
                                    <small>TPV Virtual Redsys</small>
                                </span>
                            </label>
                        </div>

                        <!-- Botón PayPal (se mostrará solo si está seleccionado) -->
                        <div id="paypal-button-container" style="margin-top: 1.5rem;"></div>

                        <!-- Botón Redsys (se mostrará solo si está seleccionado) -->
                        <div id="redsys-container" style="display: none; margin-top: 1.5rem;">
                            <button id="btn-pagar-redsys" class="btn btn-primary btn-block">
                                Pagar con tarjeta
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Resumen del pedido -->
                <div class="checkout-resumen">
                    <h2>Resumen del pedido</h2>
                    
                    <div id="resumen-productos" class="resumen-productos">
                        <!-- Se llena dinámicamente -->
                    </div>

                    <div class="resumen-totales">
                        <div class="resumen-linea">
                            <span>Subtotal:</span>
                            <span id="checkout-subtotal">€0.00</span>
                        </div>
                        
                        <div class="resumen-linea">
                            <span>Envío:</span>
                            <span id="checkout-envio">€4.95</span>
                        </div>
                        
                        <div class="resumen-linea resumen-total">
                            <span>Total:</span>
                            <span id="checkout-total">€0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- PayPal SDK (reemplaza TU_CLIENT_ID con tu Client ID de PayPal Sandbox) -->
    <script src="https://www.paypal.com/sdk/js?client-id=AWhVQYYnWaffqykoGvgsUJFlLdpO9jAnZUwOIv4_KF1JlFqQeLC1BCT7XUSNJtmJkzJ4Saz8SfEvEUNQ&currency=EUR"></script>
    
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/main.js?v=2.0"></script>
    <script src="js/footer.js"></script>
    <script>
        // Cargar resumen al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar elementos del sitio (incluye el logo)
            initializeSiteElements();
            
            // Verificar carrito y mostrar resumen
            if (typeof carrito !== 'undefined' && carrito.items && carrito.items.length === 0) {
                alert('Tu carrito está vacío');
                window.location.href = 'index.html';
                return;
            }
            
            // Verificar también localStorage como fallback
            let carritoItems = [];
            try {
                const carritoLS = localStorage.getItem('carrito');
                if (carritoLS) {
                    carritoItems = JSON.parse(carritoLS);
                }
            } catch (error) {
                console.error('Error parsing carrito:', error);
            }
            
            if (carritoItems.length === 0 && (!carrito || !carrito.items || carrito.items.length === 0)) {
                alert('Tu carrito está vacío');
                window.location.href = 'index.html';
                return;
            }

            // Usar la función original de mostrar resumen
            if (typeof mostrarResumenCheckout === 'function') {
                mostrarResumenCheckout();
            } else {
                // Fallback si no existe
                mostrarResumenCheckoutDirecto(carritoItems);
            }
            
            // Actualizar contador del carrito
            if (typeof carrito !== 'undefined' && carrito.actualizarContador) {
                carrito.actualizarContador();
            }
            updateCartCounter();
            
            // Inicializar funcionalidades de pago (tu código original)
            if (typeof inicializarPayPal === 'function') {
                inicializarPayPal();
            }
            manejarCambioMetodoPago();
        });

        // Función de fallback para mostrar resumen (por si acaso)
        function mostrarResumenCheckoutDirecto(items) {
            console.log('📦 Mostrando resumen con', items.length, 'productos');
            
            const resumenProductos = document.getElementById('resumen-productos');
            if (resumenProductos) {
                const html = items.map(item => `
                    <div class="resumen-item">
                        <div class="resumen-item-info">
                            <h4>${item.name}</h4>
                            <p>Cantidad: ${item.cantidad || 1} x €${item.price}</p>
                        </div>
                        <div class="resumen-item-precio">
                            €${(item.price * (item.cantidad || 1)).toFixed(2)}
                        </div>
                    </div>
                `).join('');
                
                resumenProductos.innerHTML = html;
            }
            
            // Calcular totales
            const subtotal = items.reduce((total, item) => {
                return total + (item.price * (item.cantidad || 1));
            }, 0);
            
            const envio = 4.95;
            const total = subtotal + envio;
            
            // Actualizar totales en la interfaz
            const subtotalElement = document.getElementById('checkout-subtotal');
            const totalElement = document.getElementById('checkout-total');
            
            if (subtotalElement) subtotalElement.textContent = `€${subtotal.toFixed(2)}`;
            if (totalElement) totalElement.textContent = `€${total.toFixed(2)}`;
        }

        // Cambiar método de pago
        function manejarCambioMetodoPago() {
            const radios = document.querySelectorAll('input[name="metodo-pago"]');
            
            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'paypal') {
                        document.getElementById('paypal-button-container').style.display = 'block';
                        document.getElementById('redsys-container').style.display = 'none';
                    } else {
                        document.getElementById('paypal-button-container').style.display = 'none';
                        document.getElementById('redsys-container').style.display = 'block';
                    }
                });
            });
        }

        // Pago con Redsys (tu código original)
        document.addEventListener('DOMContentLoaded', () => {
            const btnRedsys = document.getElementById('btn-pagar-redsys');
            if (btnRedsys) {
                btnRedsys.addEventListener('click', async () => {
                    if (!validarFormulario()) {
                        alert('Por favor, completa todos los campos');
                        return;
                    }

                    // Aquí iría la integración real con Redsys
                    alert('Pago con Redsys - Por implementar');
                });
            }
        });

        function validarFormulario() {
            const form = document.getElementById('form-checkout');
            return form.checkValidity();
        }
    </script>
</body>
</html>
