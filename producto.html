<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Origen Puro Coffee</title>
    <meta name="description" content="Descubre los detalles de nuestros cafés de especialidad premium">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CSS Elegante -->
    <link rel="stylesheet" href="css/styles-elegant.css">
    <link rel="stylesheet" href="css/header-responsive.css">
</head>
<body>
    <!-- HEADER FIJO ELEGANTE -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="Origen Puro Coffee" class="header-logo-image">
                </a>
            </div>
            
            <!-- Botón hamburger para móvil -->
            <button class="menu-toggle" onclick="toggleMenu()">
                ☰
            </button>
            
            <nav class="nav" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="mis-compras.html">Mis Compras</a>
                <a href="carrito.html" class="cart-link active">
                    <i class="ph ph-shopping-cart"></i> Carrito (<span id="cart-count">0</span>)
                </a>
            </nav>
        </div>
    </header>

    <!-- DETALLE DEL PRODUCTO ELEGANTE -->
    <section class="producto-detalle">
        <div class="container">
            <div class="producto-layout">
                <!-- Imagen del producto -->
                <div class="producto-imagen">
                    <img id="producto-img" src="" alt="Producto">
                    <img id="producto-img-secondary" src="" alt="Producto vista 2" style="margin-top: 1rem; display: none;">
                </div>

                <!-- Información del producto -->
                <div class="producto-info">
                    <h1 id="producto-nombre">Cargando...</h1>
                    <p class="producto-origen" id="producto-origen"></p>
                    
                    <div class="producto-precio-container">
                        <span class="producto-precio-original" id="precio-original" style="display: none;"></span>
                        <span class="producto-precio" id="producto-precio">€0.00</span>
                        <span class="producto-descuento" id="producto-descuento" style="display: none;"></span>
                    </div>

                    <div class="producto-descripcion">
                        <h3>Descripción</h3>
                        <p id="producto-descripcion">Cargando descripción...</p>
                    </div>

                    <!-- Características adicionales -->
                    <div class="producto-caracteristicas">
                        <div class="caracteristica">
                            <strong>Nivel de tueste:</strong> <span id="nivel-tueste">Medio</span>
                        </div>
                        <div class="caracteristica">
                            <strong>Peso:</strong> <span id="peso-producto">250g</span>
                        </div>
                    </div>

                    <!-- Selector de cantidad elegante -->
                    <div class="cantidad-selector">
                        <label for="cantidad">Cantidad:</label>
                        <div class="cantidad-controls">
                            <button id="btn-decrementar" class="btn-cantidad">−</button>
                            <input type="number" id="cantidad" value="1" min="1" max="10" readonly>
                            <button id="btn-incrementar" class="btn-cantidad">+</button>
                        </div>
                    </div>

                    <!-- Botones de acción elegantes -->
                    <div class="producto-acciones">
                        <button id="btn-agregar-carrito" class="btn btn-primary">
                            <i class="ph ph-shopping-cart"></i> Añadir al carrito
                        </button>
                        <a href="index.html" class="btn btn-secondary">
                            ← Volver a la tienda
                        </a>
                    </div>

                    <!-- Mensaje de confirmación elegante -->
                    <div id="mensaje-agregado" class="mensaje-exito" style="display: none;">
                        ✓ Producto añadido al carrito
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- El footer se genera dinámicamente con JavaScript -->

    <!-- Scripts -->
    <script src="js/header-responsive.js"></script>
    <script src="js/config.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/elegant-interactions.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // Inicializar elementos del sitio
        document.addEventListener('DOMContentLoaded', () => {

            // Actualizar contador del carrito
            if (typeof carrito !== 'undefined') {
                carrito.actualizarContador();
                updateCartCounter();
            }

            // Controles de cantidad elegantes
            document.getElementById('btn-incrementar').addEventListener('click', () => {
                const input = document.getElementById('cantidad');
                if (input.value < 10) {
                    input.value = parseInt(input.value) + 1;
                    // Efecto visual
                    input.style.transform = 'scale(1.1)';
                    setTimeout(() => input.style.transform = 'scale(1)', 200);
                }
            });

            document.getElementById('btn-decrementar').addEventListener('click', () => {
                const input = document.getElementById('cantidad');
                if (input.value > 1) {
                    input.value = parseInt(input.value) - 1;
                    // Efecto visual
                    input.style.transform = 'scale(1.1)';
                    setTimeout(() => input.style.transform = 'scale(1)', 200);
                }
            });

            // Agregar al carrito con efecto
            document.getElementById('btn-agregar-carrito').addEventListener('click', () => {
                agregarAlCarritoConEfecto();
            });
                       
            console.log('🎨 Página de producto con diseño elegante cargada');
        });

        // Función mejorada para agregar al carrito
        function agregarAlCarritoConEfecto() {
            const cantidad = parseInt(document.getElementById('cantidad').value);
            const btn = document.getElementById('btn-agregar-carrito');
            const mensaje = document.getElementById('mensaje-agregado');
            
            if (window.productoActual) {
                // Efecto en el botón
                const originalText = btn.innerHTML;
                btn.innerHTML = '⏳ Agregando...';
                btn.disabled = true;
                
                // Agregar al carrito
                carrito.agregar(window.productoActual, cantidad);
                
                setTimeout(() => {
                    btn.innerHTML = '✅ ¡Agregado!';
                    btn.style.background = 'linear-gradient(135deg, #6B8E3D 0%, #5A7A2E 100%)';
                    
                    // Mostrar mensaje
                    mensaje.style.display = 'block';
                    mensaje.style.opacity = '0';
                    mensaje.style.transform = 'translateY(10px)';
                    
                    // Animación del mensaje
                    setTimeout(() => {
                        mensaje.style.transition = 'all 0.3s ease';
                        mensaje.style.opacity = '1';
                        mensaje.style.transform = 'translateY(0)';
                    }, 50);
                    
                    // Resetear botón
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.style.background = '';
                        btn.disabled = false;
                        
                        // Ocultar mensaje
                        mensaje.style.opacity = '0';
                        mensaje.style.transform = 'translateY(-10px)';
                        setTimeout(() => {
                            mensaje.style.display = 'none';
                        }, 300);
                    }, 2000);
                }, 500);
                
                // Resetear cantidad
                document.getElementById('cantidad').value = 1;
            }
        }
    </script>

    <!-- Estilos movedos a css/producto-minimal.css -->
</body>
</html>
