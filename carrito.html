<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Origen Puro Coffee</title>
    <meta name="description" content="Revisa y gestiona los productos en tu carrito de compra">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CSS Elegante -->
    <link rel="stylesheet" href="css/styles-elegant.css">
</head>
<body>
    <!-- HEADER FIJO ELEGANTE -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-content">
                    <h1>OPC</h1>
                    <div class="tagline">ORIGEN PURO CAFÉ</div>
                </div>
            </div>
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="mis-compras.html">Mis Compras</a>
                <a href="carrito.html" class="cart-link active">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </a>
            </nav>
        </div>
    </header>

    <!-- CARRITO -->
    <section class="carrito-section">
        <div class="container">
            <h1 class="page-title">Mi Carrito</h1>

            <!-- Carrito vacío -->
            <div id="carrito-vacio" class="carrito-vacio">
                <p>Tu carrito está vacío</p>
                <a href="index.html" class="btn btn-primary">Ir a la tienda</a>
            </div>

            <!-- Carrito con productos -->
            <div id="carrito-contenido" class="carrito-layout" style="display: none;">
                <!-- Items del carrito -->
                <div class="carrito-items">
                    <div id="lista-productos">
                        <!-- Se llena dinámicamente con JavaScript -->
                    </div>
                </div>

                <!-- Resumen del carrito -->
                <div class="carrito-resumen" id="resumen-carrito">
                    <h2>Resumen del Pedido</h2>
                    
                    <div class="resumen-linea">
                        <span>Subtotal:</span>
                        <span id="subtotal">€0.00</span>
                    </div>
                    
                    <div class="resumen-linea">
                        <span>Envío:</span>
                        <span>Gratis</span>
                    </div>
                    
                    <div class="resumen-linea resumen-total">
                        <span>Total:</span>
                        <span id="total">€0.00</span>
                    </div>
                    
                    <a href="checkout.html" class="btn btn-success btn-block">
                        Proceder al Checkout
                    </a>
                    
                    <a href="index.html" class="btn btn-secondary btn-block">
                        Continuar Comprando
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- El footer se genera dinámicamente con JavaScript -->

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/elegant-interactions.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar elementos del sitio
            initializeSiteElements();
            
            // Debug: Verificar estado del carrito
            console.log('🛒 Inicializando página de carrito');
            console.log('📦 LocalStorage carrito:', localStorage.getItem('carrito'));
            
            // Cargar carrito desde localStorage directamente
            let carritoItems = [];
            try {
                const carritoLS = localStorage.getItem('carrito');
                if (carritoLS) {
                    carritoItems = JSON.parse(carritoLS);
                    console.log('✅ Carrito cargado desde localStorage:', carritoItems);
                }
            } catch (error) {
                console.error('❌ Error parsing localStorage:', error);
            }
            
            if (typeof carrito !== 'undefined') {
                console.log('✅ Objeto carrito encontrado');
                console.log('📦 Items en carrito:', carrito.items || carrito);
                
                // Intentar actualizar contador de manera segura
                try {
                    if (carrito.actualizarContador && typeof carrito.actualizarContador === 'function') {
                        carrito.actualizarContador();
                    }
                    if (typeof updateCartCounter === 'function') {
                        updateCartCounter();
                    }
                } catch (error) {
                    console.error('❌ Error actualizando contador:', error);
                    // Actualizar contador manualmente
                    const cartCountElement = document.getElementById('cart-count');
                    if (cartCountElement && carritoItems.length > 0) {
                        const totalItems = carritoItems.reduce((total, item) => total + (item.cantidad || 1), 0);
                        cartCountElement.textContent = totalItems;
                    }
                }
            } else {
                console.error('❌ Objeto carrito no encontrado');
            }
            
            // Mostrar carrito usando los datos que sabemos que existen
            mostrarCarritoDirecto(carritoItems);
            
            console.log('🎨 Página Carrito con diseño elegante cargada');
        });

        // Función que trabaja directamente con los datos del localStorage
        function mostrarCarritoDirecto(items) {
            console.log('🔍 Ejecutando mostrarCarritoDirecto con items:', items);
            
            const carritoVacio = document.getElementById('carrito-vacio');
            const carritoContenido = document.getElementById('carrito-contenido');
            
            if (items && items.length > 0) {
                console.log('📦 Mostrando', items.length, 'productos en carrito');
                
                if (carritoVacio) carritoVacio.style.display = 'none';
                if (carritoContenido) carritoContenido.style.display = 'grid';
                
                // Mostrar productos con diseño mejorado
                const listaProductos = document.getElementById('lista-productos');
                
                if (listaProductos) {
                    const html = items.map(item => `
                        <div class="carrito-item">
                            <img src="${item.main_image || item.image || 'img/default-coffee.jpg'}" alt="${item.name}">
                            <div class="carrito-item-info">
                                <h3>${item.name}</h3>
                                <p>${item.description || 'Café premium de especialidad'}</p>
                                <div class="carrito-item-cantidad">
                                    <button class="btn-cantidad" onclick="cambiarCantidad(${item.id}, -1)">−</button>
                                    <span>${item.cantidad || 1}</span>
                                    <button class="btn-cantidad" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                                </div>
                                <button class="btn-eliminar" onclick="eliminarDelCarritoDirecto(${item.id})">Eliminar</button>
                            </div>
                            <div class="carrito-item-precio">
                                <span class="precio-unitario">€${item.price} × ${item.cantidad || 1}</span>
                                <span class="precio-total">€${(item.price * (item.cantidad || 1)).toFixed(2)}</span>
                            </div>
                        </div>
                    `).join('');
                    
                    console.log('🖼️ HTML generado para', items.length, 'productos');
                    listaProductos.innerHTML = html;
                }
                
                // Actualizar totales
                actualizarTotalesDirecto(items);
                
            } else {
                console.log('📭 Carrito está vacío');
                if (carritoVacio) carritoVacio.style.display = 'block';
                if (carritoContenido) carritoContenido.style.display = 'none';
            }
        }

        // Función para actualizar totales directamente
        function actualizarTotalesDirecto(items) {
            if (items && items.length > 0) {
                const subtotal = items.reduce((total, item) => {
                    const cantidad = item.cantidad || item.quantity || 1;
                    return total + (item.price * cantidad);
                }, 0);
                
                console.log('💰 Subtotal calculado:', subtotal);
                
                const subtotalElement = document.getElementById('subtotal');
                const totalElement = document.getElementById('total');
                
                if (subtotalElement) subtotalElement.textContent = `€${subtotal.toFixed(2)}`;
                if (totalElement) totalElement.textContent = `€${subtotal.toFixed(2)}`;
            }
        }

        // Función para eliminar del carrito trabajando directamente con localStorage
        function eliminarDelCarritoDirecto(id) {
            console.log('🗑️ Eliminando producto ID:', id);
            
            try {
                let carritoItems = JSON.parse(localStorage.getItem('carrito') || '[]');
                carritoItems = carritoItems.filter(item => item.id !== id);
                localStorage.setItem('carrito', JSON.stringify(carritoItems));
                
                // Recargar la vista
                mostrarCarritoDirecto(carritoItems);
                
                // Actualizar contador
                const cartCountElement = document.getElementById('cart-count');
                if (cartCountElement) {
                    const totalItems = carritoItems.reduce((total, item) => total + (item.cantidad || 1), 0);
                    cartCountElement.textContent = totalItems;
                }
                
                console.log('✅ Producto eliminado, nuevo carrito:', carritoItems);
                
            } catch (error) {
                console.error('❌ Error eliminando producto:', error);
            }
        }

        // Función para cambiar cantidad
        function cambiarCantidad(id, cambio) {
            console.log('📊 Cambiando cantidad producto ID:', id, 'cambio:', cambio);
            
            try {
                let carritoItems = JSON.parse(localStorage.getItem('carrito') || '[]');
                const item = carritoItems.find(item => item.id === id);
                
                if (item) {
                    item.cantidad = Math.max(1, (item.cantidad || 1) + cambio);
                    localStorage.setItem('carrito', JSON.stringify(carritoItems));
                    
                    // Recargar la vista
                    mostrarCarritoDirecto(carritoItems);
                    
                    // Actualizar contador
                    const cartCountElement = document.getElementById('cart-count');
                    if (cartCountElement) {
                        const totalItems = carritoItems.reduce((total, item) => total + (item.cantidad || 1), 0);
                        cartCountElement.textContent = totalItems;
                    }
                }
                
            } catch (error) {
                console.error('❌ Error cambiando cantidad:', error);
            }
        }
    </script>
</body>
</html>
