<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origen Puro Coffee - Café de Especialidad Premium</title>
    <meta name="description" content="Descubre cafés excepcionales de las mejores regiones del mundo. Granos selectos tostados artesanalmente para una experiencia única.">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles-elegant.css">
</head>
<body>
    <!-- HEADER FIJO ELEGANTE -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo">
                    <img src="img/logo.png" alt="Origen Puro Coffee" class="header-logo-image">
                </div>
            </div>
            <nav class="nav">
                <a href="index.html">Inicio</a>
                <a href="mis-compras.html">Mis Compras</a>
                <a href="carrito.html" class="cart-link">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </a>
            </nav>
        </div>
    </header>

    <!-- HERO ELEGANTE CON IMAGEN DE FONDO -->
    <section class="hero">
        <!-- Elementos decorativos flotantes -->
        <div class="hero-floating">☕</div>
        <div class="hero-floating">🌱</div>
        <div class="hero-floating">⭐</div>
        
        <div class="container">
            <div class="hero-content">
                <h2>Descubre cafés excepcionales</h2>
                <p>Granos selectos de las mejores regiones del mundo, tostados artesanalmente para una experiencia única</p>
                <div class="hero-badge">
                    Calidad Premium Garantizada
                </div>
            </div>
        </div>
    </section>

    <!-- SECCIÓN DE CARACTERÍSTICAS (Se agrega dinámicamente) -->

    <!-- PRODUCTOS DESTACADOS -->
    <section class="productos-section">
        <div class="container">
            <h2 class="section-title">Nuestros Cafés</h2>
            
            <!-- Productos TOP -->
            <div id="productos-top" class="productos-grid">
                <!-- Se llenan dinámicamente con JavaScript -->
            </div>

            <h3 class="section-subtitle">Todos los productos</h3>
            
            <!-- Todos los productos -->
            <div id="productos-todos" class="productos-grid">
                <!-- Se llenan dinámicamente con JavaScript -->
            </div>
        </div>
    </section>

    <!-- El footer se genera dinámicamente con JavaScript -->

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/elegant-interactions.js"></script>
    <script>
        // Cargar productos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar configuración del sitio
            initializeSiteElements();
            
            // Cargar productos (estas funciones deben estar en main.js)
            if (typeof cargarProductosTop === 'function') {
                cargarProductosTop();
            }
            if (typeof cargarTodosProductos === 'function') {
                cargarTodosProductos();
            }
            
            // Actualizar contador del carrito después de que esté disponible
            if (typeof carrito !== 'undefined') {
                carrito.actualizarContador();
                updateCartCounter();
            }
            
            // Log para debug del nuevo diseño
            console.log('🎨 Diseño elegante iniciado');
        });
    </script>
</body>
</html>
